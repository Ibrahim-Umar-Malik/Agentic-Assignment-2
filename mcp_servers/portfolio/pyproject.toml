[project]
name = "gigbid-portfolio-mcp"
version = "1.0.0"
description = "MCP server that finds evidence in a freelancer portfolio (case studies, repos, reviews, past proposals with outcomes)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["mcp>=1.30,<2", "numpy>=1.26", "pydantic>=2.7", "pyyaml>=6", "pypdf>=4", "uvicorn>=0.30"]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0"]

[project.scripts]
gigbid-portfolio-mcp = "gigbid_portfolio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.wheel.force-include]
"__init__.py" = "gigbid_portfolio_mcp/__init__.py"
"server.py" = "gigbid_portfolio_mcp/server.py"
"tools.py" = "gigbid_portfolio_mcp/tools.py"
"resources.py" = "gigbid_portfolio_mcp/resources.py"
"prompts.py" = "gigbid_portfolio_mcp/prompts.py"
"backend.py" = "gigbid_portfolio_mcp/backend.py"
"../../rag" = "gigbid_portfolio_mcp/rag"
"../../data/personas/ai_ml" = "gigbid_portfolio_mcp/sample_persona"

[tool.hatch.build.targets.sdist]
include = ["*.py", "README.md", "pyproject.toml"]
